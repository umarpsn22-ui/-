name: Build Melo Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble Flutter project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .melo-payload/part00 \
            .melo-payload/part01 \
            .melo-payload/part02 \
            .melo-payload/part02b \
            .melo-payload/part03 \
            .melo-payload/part04 \
            .melo-payload/part05 \
            .melo-payload/part06 \
            .melo-payload/part07 \
            .melo-payload/part08 \
            | base64 --decode > /tmp/MeloPlayer.tar.xz
          xz --test /tmp/MeloPlayer.tar.xz
          tar -xJf /tmp/MeloPlayer.tar.xz
          sed -i 's/8[.]13/8.14.3/g' MeloPlayer/android/gradlew
          sed -i 's/gradle-8[.]13-all.zip/gradle-8.14.3-all.zip/g' MeloPlayer/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/version "2[.]2[.]0"/version "2.2.20"/' MeloPlayer/android/settings.gradle
          python3 - <<'PY'
          from pathlib import Path
          source = Path("MeloPlayer/lib/app_state.dart")
          code = source.read_text()
          patches = [
              ("await picked.readAsByteStream().pipe(sink);", "await sink.addStream(picked.readAsByteStream());\\n          await sink.close();"),
              ("await selected.readAsByteStream().pipe(sink);", "await sink.addStream(selected.readAsByteStream());\\n      await sink.close();"),
          ]
          for old, new in patches:
              if old not in code:
                  raise SystemExit(f"Expected code pattern not found: {old}")
              code = code.replace(old, new, 1)
          source.write_text(code)
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies and analyze
        working-directory: MeloPlayer
        run: |
          flutter --version
          flutter pub get
          flutter analyze
        continue-on-error: true

      - name: Build release APK
        working-directory: MeloPlayer
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: melo-player-release-apk
          path: MeloPlayer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
